name: Build & Package Android Portable Kit

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------
  # JOB 1: build launcher .exe + zip program
  # ------------------------------------------------------------
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pasang Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pasang PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build EXE launcher
        working-directory: launcher
        run: python -m PyInstaller --noconsole --onefile --name AndroidPortable ap_gui.py

      - name: Kumpulkan file kit + bungkus zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "stage/AndroidPortableKit"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item MULAI-DISINI.txt,PANDUAN-LENGKAP.txt,README.md,1-Siapkan-Offline.bat,1-Setup-Awal.bat,2-Buka-Launcher.bat $stage/
          Copy-Item config -Destination $stage -Recurse -Force
          Copy-Item scripts -Destination $stage -Recurse -Force
          Copy-Item data -Destination $stage -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$stage/launcher" | Out-Null
          Copy-Item launcher/ap_core.py,launcher/ap_gui.py,launcher/BUILD-EXE.bat,launcher/requirements.txt "$stage/launcher/"
          New-Item -ItemType Directory -Force -Path "$stage/runtime" | Out-Null
          Copy-Item runtime/.keep "$stage/runtime/"
          Copy-Item launcher/dist/AndroidPortable.exe "$stage/AndroidPortable.exe"
          Compress-Archive -Path $stage/* -DestinationPath AndroidPortableKit.zip -Force
          Copy-Item launcher/dist/AndroidPortable.exe AndroidPortable.exe
          Write-Host "Isi stage:"; Get-ChildItem $stage | Format-Table Name,Length

      - name: Bikin GitHub Release + lampirkan file
        uses: softprops/action-gh-release@v2
        with:
          name: "Android Portable Kit ${{ github.ref_name }}"
          files: |
            AndroidPortable.exe
            AndroidPortableKit.zip
          generate_release_notes: true

  # ------------------------------------------------------------
  # JOB 2: bundel QEMU portable + ADB (offline runtime)
  # ------------------------------------------------------------
  runtime:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pasang QEMU (silent, portable ke C:\qemu_portable)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          curl.exe -L --retry 5 -o "$env:RUNNER_TEMP\qemu-setup.exe" https://qemu.weilnetz.de/w64/qemu-w64-setup-20260811.exe
          Start-Process "$env:RUNNER_TEMP\qemu-setup.exe" -ArgumentList "/S","/D=C:\qemu_portable" -Wait
          if (-not (Test-Path "C:\qemu_portable\qemu-system-x86_64.exe")) { throw "QEMU gak terpasang" }
          Write-Host "QEMU OK"

      - name: Download ADB platform-tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "C:\stage_rt" | Out-Null
          curl.exe -L --retry 5 -o "$env:RUNNER_TEMP\pt.zip" https://dl.google.com/android/repository/platform-tools-latest-windows.zip
          Expand-Archive -Force "$env:RUNNER_TEMP\pt.zip" "$env:RUNNER_TEMP\pt"
          Move-Item "$env:RUNNER_TEMP\pt\platform-tools" "C:\stage_rt\adb"
          Write-Host "ADB OK"

      - name: Bungkus Runtime-QEMU-ADB.zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Move-Item "C:\qemu_portable" "C:\stage_rt\qemu"
          Compress-Archive -Path "C:\stage_rt\*" -DestinationPath "Runtime-QEMU-ADB.zip" -Force
          Get-Item "Runtime-QEMU-ADB.zip" | Select-Object Name,Length

      - name: Lampirkan ke Release
        uses: softprops/action-gh-release@v2
        with:
          files: Runtime-QEMU-ADB.zip

  # ------------------------------------------------------------
  # JOB 3: bundel ISO Android (terpecah < 1.2 GB per bagian)
  #         -> mode offline: install sekali klik di VM, tanpa internet
  # ------------------------------------------------------------
  iso:
    needs: runtime
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Download ISO BlissOS 16 GApps
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "C:\\aw" | Out-Null
          curl.exe -L --retry 5 -o "C:\\aw\\bliss.iso" "https://downloads.sourceforge.net/project/blissos-x86/Official/BlissOS16/Gapps/Generic/Bliss-v16.9.7-x86_64-OFFICIAL-gapps-20241011.iso"
          $iso = Get-Item "C:\\aw\\bliss.iso"
          if ($iso.Length -lt 1GB) { throw "ISO kurang lengkap" }
          Write-Host ("ISO: " + [math]::Round($iso.Length/1GB,2) + " GB")

      - name: Pecah ISO jadi bagian < 1.2 GB
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $chunk = 1200MB
          $buf = New-Object byte[] (64MB)
          $i = 1; $written = 0; $out = $null
          $in = [IO.File]::OpenRead("C:\\aw\\bliss.iso")
          try {
            while (($read = $in.Read($buf, 0, $buf.Length)) -gt 0) {
              if ($null -eq $out -or $written -ge $chunk) {
                if ($null -ne $out) { $out.Close() }
                $name = "BlissOS16-GApps.iso.part{0:D2}" -f $i
                $out = [IO.File]::OpenWrite($name); $written = 0; $i++
              }
              $out.Write($buf, 0, $read); $written += $read
            }
          } finally { if ($out) { $out.Close() }; $in.Close() }
          $hash = Get-ChildItem "BlissOS16-GApps.iso.part*" | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)"
          }
          $hash | Set-Content "SHA256SUMS.txt" -Encoding ASCII
          Get-ChildItem "BlissOS16-GApps.iso.part*","SHA256SUMS.txt" | Format-Table Name,Length

      - name: Lampirkan ISO ke Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BlissOS16-GApps.iso.part*
            SHA256SUMS.txt
